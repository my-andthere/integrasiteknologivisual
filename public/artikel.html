<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artikel — PT. Integration Teknologi Visual</title>
  <meta name="description" content="Artikel dan wawasan terbaru dari PT. Integration Teknologi Visual." />
  <meta property="og:type" content="article" />
  <meta property="og:title" content="Artikel — PT. Integration Teknologi Visual" />
  <meta property="og:description" content="Artikel dan wawasan terbaru dari PT. Integration Teknologi Visual." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta property="og:image" content="/img/og-default.svg" />
  <link rel="canonical" href="https://www.integrasiteknologivisual.com" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css" />

</head>
<body>

<header class="header">
  <div class="wrap nav">
    <a href="/" class="brand">
      <span class="brand__mark" data-brand="logo">ITV</span>
      <span class="brand__text">
        <span data-brand="company">Integration Teknologi Visual</span>
        <small data-brand="tagline">Enterprise Digital Solution Partner</small>
      </span>
    </a>
    <nav class="nav__links" id="navLinks">
      <a href="/#tentang" data-i18n-text="Tentang">Tentang</a>
      <a href="/#layanan">Layanan</a>
      <a href="/#produk" data-i18n-text="Produk">Produk</a>
      <a href="/#sektor">Sektor</a>
      <a href="/#insight">Insight</a>
      <a href="/#kontak">Kontak</a>
      <div class="lang-switch" data-lang-switch data-i18n-ignore>
        <button class="lang-switch__toggle" type="button" data-lang-toggle aria-haspopup="menu" aria-expanded="false">
          <i class="bi bi-globe2" aria-hidden="true"></i>
          <span data-lang-current>ID</span>
          <i class="bi bi-chevron-down" aria-hidden="true"></i>
        </button>
        <div class="lang-switch__wrap" data-lang-wrap role="menu">
          <button type="button" role="menuitem" data-lang="id" aria-selected="true"><span class="lang-switch__code">ID</span><span class="lang-switch__name">Indonesia</span></button>
          <button type="button" role="menuitem" data-lang="en" aria-selected="false"><span class="lang-switch__code">EN</span><span class="lang-switch__name">English</span></button>
          <button type="button" role="menuitem" data-lang="ja" aria-selected="false"><span class="lang-switch__code">JA</span><span class="lang-switch__name">&#26085;&#26412;&#35486;</span></button>
        </div>
      </div>
    </nav>
    <a href="/#kontak" class="btn btn--primary" data-track="cta_artikel_kontak">Konsultasi Gratis</a>
    <button class="nav__toggle" id="navToggle" aria-label="Buka menu"><i class="bi bi-list"></i></button>
  </div>
</header>

<main class="article-page">
  <div class="wrap">
    <a href="/#insight" class="back-link" data-i18n-text="Kembali ke daftar artikel"><i class="bi bi-arrow-left"></i> Kembali ke daftar artikel</a>
    <div id="articleRoot">
      <p class="muted">Memuat artikel…</p>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="wrap">
    <div class="footer__bottom">
      <span>&copy; <span id="year">2026</span> <span data-brand="company">PT. Integration Teknologi Visual</span>. <span data-i18n-text="Seluruh hak cipta dilindungi.">Seluruh hak cipta dilindungi.</span></span>
      <span>Profesional &middot; Edukatif &middot; Konsultatif &middot; Solutif</span>
    </div>
  </div>
</footer>

<script src="/i18n-data.js"></script>
<script src="/i18n.js"></script>
<script>
  const API = '/api';
  let SEO = {};

  /** Terjemahkan pesan runtime lewat kamus "j" i18n. */
  function i18nMsg(text, vars) {
    if (window.ITV && typeof window.ITV.tm === 'function') return window.ITV.tm(text, vars);
    return text;
  }

  function esc(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function currentLang() {
    if (window.ITV && typeof window.ITV.getLang === 'function') return window.ITV.getLang();
    return 'id';
  }

  /** Ambil field entitas sesuai bahasa aktif: pakai translations[lang][field] bila ada. */
  function tf(item, field, fallback) {
    if (!item) return fallback;
    const lang = currentLang();
    let bag = item.translations;
    if (lang !== 'id' && bag) {
      try { bag = typeof bag === 'string' ? JSON.parse(bag) : bag; } catch { bag = null; }
      if (bag && bag[lang] && bag[lang][field] !== undefined && bag[lang][field] !== null) {
        return bag[lang][field];
      }
    }
    return item[field] !== undefined && item[field] !== null ? item[field] : fallback;
  }

  function formatDate(value) {
    if (!value) return '';
    const d = new Date(value);
    if (Number.isNaN(d.getTime())) return '';
    var tag = 'id-ID';
    if (window.ITV && typeof window.ITV.getLang === 'function') {
      var lg = window.ITV.getLang();
      if (lg === 'en') tag = 'en-GB';
      else if (lg === 'ja') tag = 'ja-JP';
    }
    return d.toLocaleDateString(tag, { day: 'numeric', month: 'long', year: 'numeric' });
  }

  function applyBranding(brand) {
    const root = document.documentElement;
    const val = (key) => String(brand[key] || '').trim();
    const map = {
      'brand.primary_color': '--blue',
      'brand.secondary_color': '--cyan',
      'brand.dark_color': '--navy'
    };
    Object.entries(map).forEach(([key, cssVar]) => {
      const color = val(key);
      if (!color) return;
      if (!/^#[0-9a-f]{3,8}$/i.test(color) && !/^rgba?\(/i.test(color)) return;
      root.style.setProperty(cssVar, color);
    });
    const logoUrl = val('brand.logo_url');
    const logoText = val('brand.logo_text');
    document.querySelectorAll('[data-brand="logo"]').forEach((n) => {
      if (logoUrl) {
        n.classList.add('brand__mark--img');
        n.innerHTML = '';
        const img = document.createElement('img');
        img.src = logoUrl;
        img.alt = val('brand.company_name') || 'Logo';
        img.decoding = 'async';
        n.appendChild(img);
      } else {
        n.classList.remove('brand__mark--img');
        n.textContent = logoText || n.textContent;
      }
    });
    const iconUrl = val('brand.icon_url');
    if (iconUrl) {
      let link = document.querySelector('link[rel="icon"]');
      if (!link) {
        link = document.createElement('link');
        link.setAttribute('rel', 'icon');
        document.head.appendChild(link);
      }
      link.setAttribute('href', iconUrl);
    }
    document.querySelectorAll('[data-brand="company"]').forEach((n) => (n.textContent = val('brand.company_name') || n.textContent));
    document.querySelectorAll('[data-brand="tagline"]').forEach((n) => (n.textContent = val('brand.tagline') || n.textContent));
  }

  function setMeta(attr, key, content) {
    if (!content) return;
    let tag = document.head.querySelector(`meta[${attr}="${key}"]`);
    if (!tag) {
      tag = document.createElement('meta');
      tag.setAttribute(attr, key);
      document.head.appendChild(tag);
    }
    tag.setAttribute('content', content);
  }

  function absoluteUrl(path) {
    const p = String(path || '').trim();
    if (!p) return '';
    if (/^https?:\/\//i.test(p)) return p;
    const base = String(SEO['seo.canonical_base'] || '').replace(/\/$/, '');
    return base ? base + p : p;
  }

  function applySeo(seo) {
    const val = (key) => String(seo[key] || '').trim();
    SEO = seo || {};
    const title = val('seo.site_title');
    const desc = val('seo.meta_description');
    if (title) document.title = title;
    if (desc) {
      let m = document.head.querySelector('meta[name="description"]');
      if (m) m.setAttribute('content', desc);
    }
    const canonical = val('seo.canonical_base');
    if (canonical) {
      let l = document.head.querySelector('link[rel="canonical"]');
      if (l) l.setAttribute('href', canonical);
    }
    const schema = document.getElementById('schemaOrg');
    const raw = val('seo.schema_org');
    if (schema && raw) {
      try {
        schema.textContent = JSON.stringify(JSON.parse(raw), null, 2);
      } catch {
        schema.textContent = raw;
      }
    }
  }

  async function loadConfig() {
    try {
      const cfg = await fetch(API + '/site-config').then((r) => r.json());
      applyBranding(cfg.branding || {});
      applySeo(cfg.seo || {});
    } catch { /* abaikan */ }
  }

  async function loadArticle() {
    const root = document.getElementById('articleRoot');
    const slug = new URLSearchParams(window.location.search).get('slug');
    if (!slug) {
      root.innerHTML = '<p class="muted">' + i18nMsg('Parameter slug artikel tidak ditemukan.') + '</p>';
      return;
    }
    try {
      const a = await fetch(API + '/articles/' + encodeURIComponent(slug)).then((r) => {
        if (!r.ok) throw new Error('not-found');
        return r.json();
      });
      const L_TITLE = tf(a, 'title', a.title || '');
      const L_EXCERPT = tf(a, 'excerpt', a.excerpt || '');
      const L_CONTENT = tf(a, 'content', a.content || '');
      const L_CATEGORY = tf(a, 'category', a.category || 'Insight');
      const L_SEO_TITLE = tf(a, 'seo_title', a.seo_title || a.title || '');
      const L_SEO_DESC = tf(a, 'seo_description', a.seo_description || a.excerpt || '');

      document.title = `${L_TITLE} — PT. Integration Teknologi Visual`;
      const meta = document.head.querySelector('meta[name="description"]');
      if (meta && L_SEO_DESC) meta.setAttribute('content', L_SEO_DESC);
      const og = document.head.querySelector('meta[property="og:title"]');
      if (og) og.setAttribute('content', L_TITLE);

      // SEO per-artikel: canonical, Open Graph, dan Twitter Card
      const slugParam = encodeURIComponent(a.slug || slug);
      const articleUrl = absoluteUrl(`/artikel.html?slug=${slugParam}`);
      if (articleUrl) {
        let link = document.head.querySelector('link[rel="canonical"]');
        if (!link) {
          link = document.createElement('link');
          link.setAttribute('rel', 'canonical');
          document.head.appendChild(link);
        }
        link.setAttribute('href', articleUrl);
        setMeta('property', 'og:url', articleUrl);
      }
      setMeta('property', 'og:type', 'article');
      if (L_SEO_TITLE) setMeta('property', 'og:title', L_SEO_TITLE);
      if (L_SEO_DESC) setMeta('property', 'og:description', L_SEO_DESC);
      setMeta('name', 'twitter:title', L_TITLE);
      setMeta('name', 'twitter:description', L_SEO_DESC);
      const imageUrl = absoluteUrl(a.cover_image || SEO['seo.og_image'] || '');
      if (imageUrl) {
        setMeta('property', 'og:image', imageUrl);
        setMeta('name', 'twitter:image', imageUrl);
      }
      if (a.published_at) {
        setMeta('property', 'article:published_time', new Date(a.published_at).toISOString());
      }

      const tags = (() => {
        const raw = tf(a, 'tags', null);
        if (Array.isArray(raw)) return raw;
        if (typeof raw === 'string' && raw.trim()) {
          return raw.split(',').map((x) => x.trim()).filter(Boolean);
        }
        return Array.isArray(a.tags) ? a.tags : [];
      })();
      root.innerHTML = `
        <article>
          <div class="article-page__head">
            <span class="eyebrow">${esc(L_CATEGORY)}</span>
            <h1 style="font-size:clamp(1.6rem,3.4vw,2.4rem)">${esc(L_TITLE)}</h1>
            <p class="lead">${esc(L_EXCERPT)}</p>
            <div class="article-card__meta">
              <span>${esc(formatDate(a.published_at))}</span>
              ${a.author ? `<span>${esc(a.author)}</span>` : ''}
              <span>${Number(a.views || 0)}${i18nMsg('× dibaca')}</span>
            </div>
            <div class="article-tags">
              ${tags.map((t) => `<span class="article-tag">${esc(t)}</span>`).join('')}
            </div>
          </div>
          <div class="article-page__cover"${a.cover_image ? ` style="background-image:url('${esc(a.cover_image)}');background-size:cover;background-position:center;"` : ''}></div>
          <div class="article-page__body">${L_CONTENT}</div>
        </article>`;

      // pelacakan
      const sid = (() => {
        try {
          const k = 'itv_sid';
          let v = sessionStorage.getItem(k);
          if (!v) { v = Math.random().toString(36).slice(2) + Date.now().toString(36); sessionStorage.setItem(k, v); }
          return v;
        } catch { return 'anon-' + Date.now(); }
      })();
      const payload = JSON.stringify({ path: window.location.pathname, referrer: document.referrer || '', session_id: sid, duration: 0 });
      try {
        if (navigator.sendBeacon) navigator.sendBeacon(API + '/track', new Blob([payload], { type: 'application/json' }));
        else fetch(API + '/track', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: payload });
      } catch { /* abaikan */ }
    } catch {
      root.innerHTML = '<p class="muted">' + i18nMsg('Artikel tidak ditemukan atau belum dipublikasikan.') + '</p>';
    }
  }

  document.getElementById('year').textContent = new Date().getFullYear();

  /* Muat ulang artikel saat bahasa berganti (tanggal & status ikut diterjemahkan). */
  if (window.ITV && typeof window.ITV.onChange === 'function') {
    window.ITV.onChange(function () {
      loadArticle();
    });
  }
  (async () => {
    // konfigurasi SEO dimuat lebih dulu agar canonical & OG image ter-resolve
    await loadConfig();
    await loadArticle();
  })();
</script>
</body>
</html>
